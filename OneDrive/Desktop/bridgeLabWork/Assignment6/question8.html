<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 8 - Photo Gallery with Hover Transformations</title>
  <link rel="stylesheet" href="question8.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="gallery-header">
    <h1>Nature Photography Gallery</h1>
    <p>Auto-responsive CSS Grid layout with image hover transformations</p>
  </header>

  <main class="photo-gallery">
    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Misty Mountains">
      </div>
      <figcaption>Misty Mountain Range</figcaption>
    </figure>

    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80" alt="Autumn Forest">
      </div>
      <figcaption>Golden Autumn Forest</figcaption>
    </figure>

    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Tropical Beach">
      </div>
      <figcaption>Serene Tropical Beach</figcaption>
    </figure>

    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80" alt="Starry Night Sky">
      </div>
      <figcaption>Starry Night over Alps</figcaption>
    </figure>

    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=600&q=80" alt="Cascading Waterfall">
      </div>
      <figcaption>Cascading River Waterfall</figcaption>
    </figure>

    <figure class="gallery-card">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80" alt="Alpine Valley">
      </div>
      <figcaption>Alpine Valley Meadows</figcaption>
    </figure>
  </main>
</body>
</html>

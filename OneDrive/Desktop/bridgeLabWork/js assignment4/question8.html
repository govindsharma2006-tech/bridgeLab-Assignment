<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 – Dynamic Object Updater</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 2rem;
        }

        .panel {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem 2.2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        h2 { color: #f8fafc; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .sub { color: #64748b; font-size: 0.82rem; margin-bottom: 1.6rem; }

        .form-group { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            padding: 0.68rem 1rem;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #34d399; }

        .btn-row { display: flex; gap: 0.8rem; margin-top: 1.2rem; }
        button {
            flex: 1;
            padding: 0.72rem;
            border: none;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        button:hover { opacity: 0.88; transform: translateY(-1px); }
        #updateBtn { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        #resetBtn  { background: #334155; color: #cbd5e1; }

        /* Object display */
        .obj-viewer {
            background: #020817;
            border-radius: 10px;
            padding: 1.2rem;
            border: 1px solid rgba(52,211,153,0.2);
        }
        .obj-viewer h3 { color: #34d399; font-size: 0.9rem; margin-bottom: 0.8rem; font-family: monospace; }

        .obj-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.88rem;
        }
        .obj-row:last-child { border-bottom: none; }

        .obj-key   { color: #7dd3fc; font-family: monospace; font-size: 0.82rem; }
        .obj-colon { color: #64748b; margin: 0 0.4rem; }
        .obj-val   {
            color: #fde68a;
            font-family: monospace;
            font-size: 0.82rem;
            background: rgba(253,230,138,0.08);
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
        }

        .flash {
            animation: flashGreen 0.6s ease;
        }
        @keyframes flashGreen {
            0%   { background: rgba(52,211,153,0.25); }
            100% { background: rgba(253,230,138,0.08); }
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            background: rgba(52,211,153,0.15);
            color: #34d399;
            border: 1px solid rgba(52,211,153,0.3);
            margin-top: 1rem;
        }
        #updateTime { font-size: 0.72rem; color: #475569; margin-top: 0.4rem; }
    </style>
</head>
<body>

<!-- Editor Form -->
<div class="panel">
    <h2>✏️ User Object Editor</h2>
    <p class="sub">Q8 – Edit values and see the object update in real-time via DOM</p>

    <div class="form-group">
        <label>Name</label>
        <input type="text" id="editName" placeholder="Enter new name">
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" placeholder="Enter new email">
    </div>
    <div class="form-group">
        <label>Age</label>
        <input type="number" id="editAge" placeholder="Enter new age" min="1" max="120">
    </div>
    <div class="form-group">
        <label>City</label>
        <input type="text" id="editCity" placeholder="Enter city">
    </div>
    <div class="form-group">
        <label>Role</label>
        <input type="text" id="editRole" placeholder="e.g. Developer">
    </div>

    <div class="btn-row">
        <button id="updateBtn" onclick="updateUser()">💾 Update Object</button>
        <button id="resetBtn"  onclick="resetUser()">↩ Reset to Default</button>
    </div>
</div>

<!-- Object Viewer -->
<div class="panel">
    <h2>📦 Live User Object</h2>
    <p class="sub">Object updates in real-time when you submit the form</p>

    <div class="obj-viewer">
        <h3>const user = {</h3>
        <div class="obj-row"><span class="obj-key">&nbsp;&nbsp;"name"</span><span class="obj-colon">:</span><span class="obj-val" id="d-name">"John"</span></div>
        <div class="obj-row"><span class="obj-key">&nbsp;&nbsp;"email"</span><span class="obj-colon">:</span><span class="obj-val" id="d-email">"john@mail.com"</span></div>
        <div class="obj-row"><span class="obj-key">&nbsp;&nbsp;"age"</span><span class="obj-colon">:</span><span class="obj-val" id="d-age">21</span></div>
        <div class="obj-row"><span class="obj-key">&nbsp;&nbsp;"city"</span><span class="obj-colon">:</span><span class="obj-val" id="d-city">"Mumbai"</span></div>
        <div class="obj-row"><span class="obj-key">&nbsp;&nbsp;"role"</span><span class="obj-colon">:</span><span class="obj-val" id="d-role">"Developer"</span></div>
        <h3>}</h3>
    </div>

    <span class="badge" id="statusBadge">Default values</span>
    <div id="updateTime"></div>
</div>

<script>
    // ── Original user object ──────────────────────────────────────────────────
    let user = {
        name:  "John",
        email: "john@mail.com",
        age:   21,
        city:  "Mumbai",
        role:  "Developer"
    };

    const DEFAULT = { ...user };

    // Populate form with current values on load
    function populateForm() {
        document.getElementById('editName').value  = user.name;
        document.getElementById('editEmail').value = user.email;
        document.getElementById('editAge').value   = user.age;
        document.getElementById('editCity').value  = user.city;
        document.getElementById('editRole').value  = user.role;
    }

    // Render the object viewer
    function renderObject(changedKeys = []) {
        const fields = ['name', 'email', 'age', 'city', 'role'];
        fields.forEach(key => {
            const el = document.getElementById('d-' + key);
            const val = typeof user[key] === 'string' ? `"${user[key]}"` : user[key];
            el.textContent = val;
            if (changedKeys.includes(key)) {
                el.classList.remove('flash');
                void el.offsetWidth;     // force reflow for re-trigger
                el.classList.add('flash');
            }
        });
    }

    // Update handler
    function updateUser() {
        const newName  = document.getElementById('editName').value.trim();
        const newEmail = document.getElementById('editEmail').value.trim();
        const newAge   = parseInt(document.getElementById('editAge').value, 10);
        const newCity  = document.getElementById('editCity').value.trim();
        const newRole  = document.getElementById('editRole').value.trim();

        const changed = [];
        if (newName  && newName  !== user.name)  { user.name  = newName;  changed.push('name');  }
        if (newEmail && newEmail !== user.email) { user.email = newEmail; changed.push('email'); }
        if (!isNaN(newAge) && newAge !== user.age){ user.age  = newAge;   changed.push('age');   }
        if (newCity  && newCity  !== user.city)  { user.city  = newCity;  changed.push('city');  }
        if (newRole  && newRole  !== user.role)  { user.role  = newRole;  changed.push('role');  }

        renderObject(changed);
        document.getElementById('statusBadge').textContent =
            changed.length ? `✅ Updated: ${changed.join(', ')}` : 'ℹ️ No changes detected';
        document.getElementById('updateTime').textContent =
            `Last updated: ${new Date().toLocaleTimeString()}`;
        console.log("Updated user object:", { ...user });
    }

    // Reset to default
    function resetUser() {
        user = { ...DEFAULT };
        populateForm();
        renderObject(Object.keys(DEFAULT));
        document.getElementById('statusBadge').textContent = 'Reset to defaults';
        document.getElementById('updateTime').textContent  = '';
    }

    // Init
    populateForm();
    renderObject();
</script>
</body>
</html>

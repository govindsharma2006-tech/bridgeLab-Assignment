<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Q1 – Welcome Page Greeting</title>
  <link rel="stylesheet" href="question1.css"/>
</head>
<body>
  <div class="container">
    <h1 id="greeting" class="greeting-text">Loading...</h1>
    <p id="welcome-msg" class="welcome-msg">Welcome to our website! We're glad you're here.</p>

    <div class="btn-group">
      <button id="changeGreetingBtn" class="btn btn-primary">Change Greeting</button>
      <button id="toggleMsgBtn" class="btn btn-secondary">Toggle Message</button>
    </div>

    <p class="hint">💡 Click on the greeting text to see an alert!</p>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="question1.js"></script>
</body>
</html>

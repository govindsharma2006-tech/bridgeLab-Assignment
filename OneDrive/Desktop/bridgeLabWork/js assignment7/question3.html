<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Q3 – Multi-Step Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 36px; width: 100%; max-width: 440px; }
    h1 { font-size: 1.4rem; color: #818cf8; margin-bottom: 24px; text-align: center; }
    .progress { display: flex; gap: 8px; margin-bottom: 28px; }
    .step-dot { flex: 1; height: 6px; border-radius: 3px; background: #334155; transition: background 0.3s; }
    .step-dot.active { background: #818cf8; }
    .step-dot.done   { background: #34d399; }
    .step-panel { display: none; }
    .step-panel.active { display: block; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 11px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 1rem; outline: none; transition: border-color 0.2s; margin-bottom: 6px; }
    input:focus { border-color: #818cf8; }
    input.error { border-color: #f87171; }
    .err-msg { color: #f87171; font-size: 0.8rem; min-height: 18px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
    .btn-next { background: #4f46e5; color: #fff; }
    .btn-next:hover { background: #4338ca; }
    .btn-back { background: #334155; color: #e2e8f0; }
    .btn-back:hover { background: #475569; }
    .summary { text-align: center; }
    .summary h2 { color: #34d399; margin-bottom: 16px; font-size: 1.3rem; }
    .summary-item { background: #0f172a; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 0.9rem; }
    .summary-item span:first-child { color: #94a3b8; }
    .summary-item span:last-child  { color: #c7d2fe; font-weight: 600; }
    .step-title { font-size: 1rem; font-weight: 700; color: #c7d2fe; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 Multi-Step Form</h1>

    <!-- Progress bar dots -->
    <div class="progress">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3"></div>
    </div>

    <!-- Step 1: Name -->
    <div class="step-panel active" id="step-1">
      <div class="step-title">Step 1 of 3 — Personal Info</div>
      <label for="nameInput">Full Name</label>
      <input type="text" id="nameInput" placeholder="e.g. John Doe" />
      <div class="err-msg" id="nameErr"></div>
      <div class="btn-row">
        <button class="btn-next" onclick="goNext(1)">Next →</button>
      </div>
    </div>

    <!-- Step 2: Email -->
    <div class="step-panel" id="step-2">
      <div class="step-title">Step 2 of 3 — Contact</div>
      <label for="emailInput">Email Address</label>
      <input type="text" id="emailInput" placeholder="e.g. john@example.com" />
      <div class="err-msg" id="emailErr"></div>
      <div class="btn-row">
        <button class="btn-back" onclick="goBack(2)">← Back</button>
        <button class="btn-next" onclick="goNext(2)">Next →</button>
      </div>
    </div>

    <!-- Step 3: Password -->
    <div class="step-panel" id="step-3">
      <div class="step-title">Step 3 of 3 — Security</div>
      <label for="passInput">Password</label>
      <input type="password" id="passInput" placeholder="Min 6 characters" />
      <div class="err-msg" id="passErr"></div>
      <div class="btn-row">
        <button class="btn-back" onclick="goBack(3)">← Back</button>
        <button class="btn-next" onclick="goNext(3)">Submit</button>
      </div>
    </div>

    <!-- Summary screen -->
    <div class="step-panel" id="step-4">
      <div class="summary">
        <h2>✅ Registration Complete!</h2>
        <div class="summary-item"><span>Name</span><span id="sumName"></span></div>
        <div class="summary-item"><span>Email</span><span id="sumEmail"></span></div>
        <div class="summary-item"><span>Password</span><span id="sumPass"></span></div>
      </div>
    </div>
  </div>

  <script>
    // ── Validation functions for each step ──
    function validateStep(step) {
      if (step === 1) {
        const val = document.getElementById("nameInput").value.trim();
        if (!val) { showErr("nameErr", "Name is required."); return false; }
        if (!/^[a-zA-Z\s]+$/.test(val)) { showErr("nameErr", "Name must contain alphabets only."); return false; }
        clearErr("nameErr");
        return true;
      }
      if (step === 2) {
        const val = document.getElementById("emailInput").value.trim();
        if (!val) { showErr("emailErr", "Email is required."); return false; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showErr("emailErr", "Enter a valid email address."); return false; }
        clearErr("emailErr");
        return true;
      }
      if (step === 3) {
        const val = document.getElementById("passInput").value;
        if (!val) { showErr("passErr", "Password is required."); return false; }
        if (val.length < 6) { showErr("passErr", "Password must be at least 6 characters."); return false; }
        clearErr("passErr");
        return true;
      }
      return true;
    }

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      const input = el.previousElementSibling;
      if (input) input.classList.add("error");
    }

    function clearErr(id) {
      const el = document.getElementById(id);
      el.textContent = "";
      const input = el.previousElementSibling;
      if (input) input.classList.remove("error");
    }

    // ── Move to the next step ──
    function goNext(currentStep) {
      if (!validateStep(currentStep)) return;

      // Update progress dots
      document.getElementById(`dot-${currentStep}`).classList.add("done");
      document.getElementById(`dot-${currentStep}`).classList.remove("active");

      const nextStep = currentStep + 1;
      document.getElementById(`step-${currentStep}`).classList.remove("active");
      document.getElementById(`step-${nextStep}`).classList.add("active");

      if (nextStep <= 3 && document.getElementById(`dot-${nextStep}`)) {
        document.getElementById(`dot-${nextStep}`).classList.add("active");
      }

      // Show summary on completing step 3
      if (currentStep === 3) {
        document.getElementById("sumName").textContent  = document.getElementById("nameInput").value.trim();
        document.getElementById("sumEmail").textContent = document.getElementById("emailInput").value.trim();
        document.getElementById("sumPass").textContent  = "••••••";
      }
    }

    // ── Move back to the previous step ──
    function goBack(currentStep) {
      const prevStep = currentStep - 1;
      document.getElementById(`step-${currentStep}`).classList.remove("active");
      document.getElementById(`step-${prevStep}`).classList.add("active");
      document.getElementById(`dot-${prevStep}`).classList.remove("done");
      document.getElementById(`dot-${prevStep}`).classList.add("active");
      document.getElementById(`dot-${currentStep}`).classList.remove("active", "done");
    }

    // ── Live error clearing as user types ──
    document.getElementById("nameInput").addEventListener("input",  () => clearErr("nameErr"));
    document.getElementById("emailInput").addEventListener("input", () => clearErr("emailErr"));
    document.getElementById("passInput").addEventListener("input",  () => clearErr("passErr"));
  </script>
</body>
</html>

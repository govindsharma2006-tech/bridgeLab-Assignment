<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Task Tracker with Priority Badges using Bootstrap 5" />
  <title>Task Tracker — Badges Demo</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="task_tracker_with_badges.css" />
</head>
<body>

  <!-- Header -->
  <header class="bg-dark text-white py-4 shadow-sm mb-4">
    <div class="container text-center text-md-start d-md-flex justify-content-between align-items-center">
      <div>
        <h1 class="fw-bold mb-1">
          Task Tracker 
          <!-- Badge counter in the header showing total pending tasks -->
          <span class="badge bg-primary rounded-pill align-middle fs-6">4 Pending</span>
        </h1>
        <p class="text-muted mb-0">Organize and track your daily priorities</p>
      </div>
      <!-- "Completed" button with embedded badge -->
      <div class="mt-3 mt-md-0">
        <button type="button" class="btn btn-outline-light position-relative">
          Completed Tasks
          <!-- Embedded badge in button -->
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">
            12+
            <span class="visually-hidden">completed tasks</span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="h4 fw-bold mb-0">Active Tasks</h2>
              <button class="btn btn-primary btn-sm">+ Add Task</button>
            </div>

            <!-- List Group component for tasks -->
            <ul class="list-group shadow-sm">
              <!-- Task 1: High Priority -->
              <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div class="form-check">
                  <input class="form-check-input me-2" type="checkbox" id="task1" />
                  <label class="form-check-label fw-semibold" for="task1">
                    Fix critical login authentication bug
                  </label>
                  <div class="small text-muted">Due today at 5:00 PM &bull; Backend Team</div>
                </div>
                <!-- Priority Badge -->
                <span class="badge bg-danger rounded-pill px-3 py-2">High</span>
              </li>

              <!-- Task 2: High Priority -->
              <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div class="form-check">
                  <input class="form-check-input me-2" type="checkbox" id="task2" />
                  <label class="form-check-label fw-semibold" for="task2">
                    Deploy Assignment 10 to production server
                  </label>
                  <div class="small text-muted">Due today at 11:59 PM &bull; DevOps</div>
                </div>
                <span class="badge bg-danger rounded-pill px-3 py-2">High</span>
              </li>

              <!-- Task 3: Medium Priority -->
              <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div class="form-check">
                  <input class="form-check-input me-2" type="checkbox" id="task3" />
                  <label class="form-check-label fw-semibold" for="task3">
                    Design dark mode theme for dashboard UI
                  </label>
                  <div class="small text-muted">Due tomorrow &bull; UI/UX Team</div>
                </div>
                <!-- Priority Badge -->
                <span class="badge bg-warning text-dark rounded-pill px-3 py-2">Medium</span>
              </li>

              <!-- Task 4: Low Priority -->
              <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div class="form-check">
                  <input class="form-check-input me-2" type="checkbox" id="task4" />
                  <label class="form-check-label fw-semibold" for="task4">
                    Update README project documentation
                  </label>
                  <div class="small text-muted">Due Sept 25 &bull; Docs Team</div>
                </div>
                <!-- Priority Badge -->
                <span class="badge bg-info text-dark rounded-pill px-3 py-2">Low</span>
              </li>
            </ul>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2026 Task Tracker — Assignment 10, Q7</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Q3 – Task Manager (jQuery AJAX + Query Params)</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:36px 16px}
    h1{text-align:center;color:#a78bfa;margin-bottom:6px;font-size:1.5rem}
    .subtitle{text-align:center;color:#64748b;font-size:.85rem;margin-bottom:16px}
    .server-note{text-align:center;background:#1e1040;border:1px solid #a78bfa;border-radius:8px;padding:10px 16px;color:#c4b5fd;font-size:.82rem;max-width:700px;margin:0 auto 24px}
    .controls{max-width:700px;margin:0 auto 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    select{padding:9px 14px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.9rem;outline:none;cursor:pointer}
    select:focus{border-color:#a78bfa}
    .count-label{color:#64748b;font-size:.85rem;margin-left:auto}
    #taskList{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
    .task-item{background:#1e293b;border:1px solid #334155;border-radius:11px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:border-color .2s}
    .task-item:hover{border-color:#a78bfa}
    .task-item.done{opacity:.55}
    .task-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:#a78bfa;flex-shrink:0}
    .task-title{flex:1;font-size:.95rem;font-weight:600}
    .task-item.done .task-title{text-decoration:line-through;color:#64748b}
    .priority-badge{padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;flex-shrink:0}
    .priority-high{background:#450a0a;color:#f87171}
    .priority-medium{background:#451a03;color:#fb923c}
    .priority-low{background:#0d2b1e;color:#34d399}
    #loader{text-align:center;color:#a78bfa;padding:20px;display:none}
  </style>
</head>
<body>
  <h1>✅ Task Manager</h1>
  <p class="subtitle">Q3 — jQuery AJAX + Query Params | JSON Server on port 3003</p>
  <div class="server-note">⚙️ Start server: <code>npx json-server db3.json --port 3003</code></div>

  <div class="controls">
    <select id="filterSelect">
      <option value="all">📋 All Tasks</option>
      <option value="high">🔴 High Priority</option>
      <option value="medium">🟠 Medium Priority</option>
      <option value="low">🟢 Low Priority</option>
      <option value="completed">✅ Completed Only</option>
    </select>
    <span class="count-label" id="countLabel">Loading...</span>
  </div>

  <div id="loader">⏳ Loading tasks...</div>
  <div id="taskList"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const API = "http://localhost:3003/tasks";

    // Load tasks on page load
    loadTasks("all");

    // On dropdown change → reload with query params
    $("#filterSelect").on("change", function () {
      loadTasks($(this).val());
    });

    function loadTasks(filter) {
      $("#loader").show();
      $("#taskList").empty();

      let params = {};
      if (filter === "completed")  params.completed = true;
      else if (filter !== "all")   params.priority  = filter;

      // Send GET with query parameters via jQuery AJAX
      $.ajax({
        url: API,
        method: "GET",
        data: params,
        success: function (tasks) {
          $("#loader").hide();
          $("#countLabel").text(tasks.length + " task(s) found");
          if (!tasks.length) {
            $("#taskList").html('<div style="text-align:center;color:#64748b;padding:24px;font-style:italic">No tasks match this filter.</div>');
            return;
          }
          tasks.forEach(task => renderTask(task));
        },
        error: function () {
          $("#loader").hide();
          $("#taskList").html('<div style="text-align:center;color:#f87171;padding:24px">❌ Cannot connect to server. Is JSON Server running on port 3003?</div>');
        }
      });
    }

    function renderTask(task) {
      const item = $(`
        <div class="task-item ${task.completed ? "done" : ""}" id="task-${task.id}">
          <input type="checkbox" ${task.completed ? "checked" : ""} data-id="${task.id}" data-completed="${task.completed}"/>
          <div class="task-title">${task.title}</div>
          <span class="priority-badge priority-${task.priority}">${task.priority.toUpperCase()}</span>
        </div>
      `);
      $("#taskList").append(item);
    }

    // Event delegation for checkbox toggle → PATCH request
    $("#taskList").on("change", "input[type='checkbox']", function () {
      const id          = $(this).data("id");
      const wasCompleted= $(this).data("completed") === true || $(this).data("completed") === "true";
      const newCompleted= !wasCompleted;
      const taskEl      = $("#task-" + id);
      const cb          = $(this);

      // Optimistic UI update
      taskEl.toggleClass("done", newCompleted);
      cb.data("completed", newCompleted);

      // Send PATCH with query param to update completed status
      $.ajax({
        url: API + "/" + id,
        method: "PATCH",
        contentType: "application/json",
        data: JSON.stringify({ completed: newCompleted }),
        error: function () {
          // Revert UI on failure
          taskEl.toggleClass("done", wasCompleted);
          cb.prop("checked", wasCompleted);
          cb.data("completed", wasCompleted);
          alert("❌ Failed to update task. Server error.");
        }
      });
    });
  </script>
</body>
</html>

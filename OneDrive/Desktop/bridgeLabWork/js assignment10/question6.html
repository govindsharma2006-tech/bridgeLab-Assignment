<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Q6 – User Registration with Duplicate Check (Axios)</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px}
    .wrap{width:100%;max-width:500px}
    .server-note{background:#0c2a1a;border:1px solid #34d399;border-radius:8px;padding:10px 14px;color:#6ee7b7;font-size:.8rem;text-align:center;margin-bottom:20px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:36px}
    h1{font-size:1.4rem;color:#34d399;margin-bottom:28px;text-align:center}
    .field{margin-bottom:20px}
    label{display:block;font-size:.85rem;color:#94a3b8;font-weight:600;margin-bottom:6px}
    input,select{width:100%;padding:11px 14px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:1rem;outline:none;transition:border-color .2s}
    input:focus,select:focus{border-color:#34d399}
    input.error{border-color:#f87171}
    input.valid{border-color:#34d399}
    .err-msg{font-size:.8rem;color:#f87171;min-height:18px;margin-top:4px}
    .btn-submit{width:100%;padding:12px;background:#059669;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:6px}
    .btn-submit:hover{background:#047857}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed}
    .success-banner{display:none;text-align:center;background:#064e3b;border:1px solid #34d399;border-radius:10px;padding:20px;color:#34d399;font-weight:700;font-size:1.05rem;margin-top:20px}
    .checking{color:#fbbf24;font-size:.8rem;margin-top:4px;display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="server-note">⚙️ Start server: <code>npx json-server db6.json --port 3006</code></div>
    <div class="card">
      <h1>📝 User Registration</h1>
      <form id="regForm" novalidate>
        <div class="field">
          <label>Full Name *</label>
          <input type="text" id="regName" placeholder="Enter your name"/>
          <div class="err-msg" id="nameErr"></div>
        </div>
        <div class="field">
          <label>Email Address *</label>
          <input type="email" id="regEmail" placeholder="Enter your email"/>
          <div class="checking" id="checkingMsg">⏳ Checking availability...</div>
          <div class="err-msg" id="emailErr"></div>
        </div>
        <div class="field">
          <label>Phone *</label>
          <input type="text" id="regPhone" placeholder="10-digit phone number"/>
          <div class="err-msg" id="phoneErr"></div>
        </div>
        <div class="field">
          <label>Role *</label>
          <select id="regRole">
            <option value="">— Select role —</option>
            <option value="student">Student</option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Manager</option>
          </select>
          <div class="err-msg" id="roleErr"></div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Register Now</button>
      </form>
      <div class="success-banner" id="successBanner">✅ Registration Successful! Welcome aboard.</div>
    </div>
  </div>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API = "http://localhost:3006/users";

    // Live email duplicate check on blur
    document.getElementById("regEmail").addEventListener("blur", function () {
      const email = this.value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
      checkEmailExists(email);
    });

    async function checkEmailExists(email) {
      document.getElementById("checkingMsg").style.display = "block";
      document.getElementById("emailErr").textContent = "";
      try {
        // GET /users?email=abc@gmail.com using Axios
        const res = await axios.get(API, { params: { email } });
        document.getElementById("checkingMsg").style.display = "none";
        if (res.data.length > 0) {
          document.getElementById("regEmail").classList.add("error");
          document.getElementById("emailErr").textContent = "⚠️ Email already registered.";
          return false;
        }
        document.getElementById("regEmail").classList.remove("error");
        document.getElementById("regEmail").classList.add("valid");
        return true;
      } catch (err) {
        document.getElementById("checkingMsg").style.display = "none";
        document.getElementById("emailErr").textContent = "❌ Could not verify email. Server may be offline.";
        return false;
      }
    }

    document.getElementById("regForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const name  = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const role  = document.getElementById("regRole").value;
      let valid   = true;

      // Validate name
      if (!name) { document.getElementById("nameErr").textContent = "Name is required."; valid = false; }
      else document.getElementById("nameErr").textContent = "";

      // Validate email format
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("emailErr").textContent = "Enter a valid email address."; valid = false;
      }

      // Validate phone
      if (!/^\d{10}$/.test(phone)) { document.getElementById("phoneErr").textContent = "Phone must be exactly 10 digits."; valid = false; }
      else document.getElementById("phoneErr").textContent = "";

      // Validate role
      if (!role) { document.getElementById("roleErr").textContent = "Please select a role."; valid = false; }
      else document.getElementById("roleErr").textContent = "";

      if (!valid) return;

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Checking...";

      // Duplicate check before POST
      const isAvailable = await checkEmailExists(email);
      if (!isAvailable) {
        btn.disabled = false;
        btn.textContent = "Register Now";
        return;
      }

      btn.textContent = "Submitting...";

      try {
        // POST new user using Axios
        await axios.post(API, { name, email, phone, role });
        document.getElementById("regForm").style.display = "none";
        document.getElementById("successBanner").style.display = "block";
      } catch (err) {
        document.getElementById("emailErr").textContent = "❌ Registration failed. Server error.";
        btn.disabled = false;
        btn.textContent = "Register Now";
      }
    });
  </script>
</body>
</html>

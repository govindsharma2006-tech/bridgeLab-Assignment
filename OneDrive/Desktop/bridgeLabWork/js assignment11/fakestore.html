<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛍️ Fake Store – Product Dashboard</title>
  <style>
    /* ===== Reset & Base ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    header {
      background: #fff;
      border-bottom: 2px solid #e2e8f0;
      padding: 18px 24px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #1a202c;
    }
    header p {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 4px;
    }

    /* ===== Controls Bar ===== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 10px;
    }
    .controls input[type="text"] {
      padding: 9px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 260px;
      outline: none;
      transition: border 0.2s;
    }
    .controls input[type="text"]:focus { border-color: #667eea; }

    .controls select {
      padding: 9px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      background: #fff;
    }
    .controls select:focus { border-color: #667eea; }

    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-primary:hover { background: #5a67d8; }
    .btn-reset { background: #e2e8f0; color: #4a5568; }
    .btn-reset:hover { background: #cbd5e0; }

    /* ===== Status / Loading ===== */
    #status-bar {
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
      color: #718096;
      min-height: 36px;
    }
    .loader {
      display: inline-block;
      width: 22px; height: 22px;
      border: 3px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Product Grid ===== */
    #product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
      padding: 16px 28px 40px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* ===== Product Card ===== */
    .product-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
      animation: fadeIn 0.3s ease;
    }
    .product-card:hover {
      box-shadow: 0 8px 24px rgba(102,126,234,0.18);
      transform: translateY(-3px);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .product-card img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .product-card .prod-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #2d3748;
      line-height: 1.4;
      margin-bottom: 8px;
      /* clamp to 3 lines */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-card .prod-price {
      font-size: 1rem;
      font-weight: 700;
      color: #48bb78;
    }
    .product-card .prod-category {
      font-size: 0.72rem;
      color: #a0aec0;
      margin-top: 4px;
      text-transform: capitalize;
    }
    .product-card .prod-rating {
      font-size: 0.75rem;
      color: #ed8936;
      margin-top: 6px;
    }

    /* ===== Cart badge on header ===== */
    #cart-count {
      display: inline-block;
      background: #667eea;
      color: #fff;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.82rem;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* ===== Modal ===== */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.active { display: flex; }
    #modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      position: relative;
      animation: fadeIn 0.25s ease;
      text-align: center;
    }
    #modal-box img { width: 160px; height: 160px; object-fit: contain; margin-bottom: 16px; }
    #modal-box h2 { font-size: 1.1rem; color: #1a202c; margin-bottom: 8px; }
    #modal-box .modal-price { font-size: 1.5rem; color: #48bb78; font-weight: 700; }
    #modal-box .modal-desc { font-size: 0.82rem; color: #718096; margin: 10px 0 16px; line-height: 1.6; }
    #modal-box .modal-category { font-size: 0.75rem; color: #a0aec0; text-transform: capitalize; margin-bottom: 14px; }
    #modal-close {
      position: absolute; top: 12px; right: 16px;
      font-size: 1.4rem; cursor: pointer; color: #718096; background: none; border: none;
    }
    .btn-add-cart {
      background: #48bb78; color: #fff;
      padding: 10px 28px; border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add-cart:hover { background: #38a169; }

    /* ===== Cart Sidebar ===== */
    #cart-sidebar {
      position: fixed; right: -340px; top: 0; bottom: 0;
      width: 320px; background: #fff;
      border-left: 1px solid #e2e8f0;
      box-shadow: -4px 0 16px rgba(0,0,0,0.1);
      z-index: 998;
      display: flex; flex-direction: column;
      transition: right 0.3s ease;
      padding: 20px;
    }
    #cart-sidebar.open { right: 0; }
    #cart-sidebar h3 { font-size: 1.1rem; margin-bottom: 16px; color: #1a202c; }
    #cart-items { flex: 1; overflow-y: auto; }
    .cart-item {
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #e2e8f0; padding: 10px 0;
      font-size: 0.82rem;
    }
    .cart-item img { width: 40px; height: 40px; object-fit: contain; }
    .cart-item .ci-name { flex: 1; color: #2d3748; font-weight: 500; }
    .cart-item .ci-price { color: #48bb78; font-weight: 700; }
    .ci-remove { background: none; border: none; color: #fc8181; cursor: pointer; font-size: 1.1rem; }
    #cart-total { font-weight: 700; font-size: 1rem; padding-top: 12px; color: #1a202c; }
    #cart-close { position: absolute; top: 16px; right: 16px; font-size: 1.3rem; cursor: pointer; background: none; border: none; color: #718096; }

    /* ===== Utility ===== */
    .no-results { text-align: center; color: #718096; padding: 60px; font-size: 1rem; grid-column: 1/-1; }
    .skeleton {
      background: #e2e8f0;
      border-radius: 12px;
      height: 220px;
      animation: shimmer 1.2s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #edf2f7 50%, #e2e8f0 75%); background-size: 800px 100%; }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <h1>🛍️ Fake Store – Product Dashboard</h1>
  <p>Fetching live products from <strong>fakestoreapi.com</strong>
    &nbsp;|&nbsp; Cart: <span id="cart-count">0 items</span>
    &nbsp;<button class="btn btn-primary" style="font-size:0.8rem;padding:5px 14px;" onclick="toggleCart()">🛒 View Cart</button>
  </p>
</header>

<!-- ===== CONTROLS ===== -->
<div class="controls">
  <input type="text" id="search-box" placeholder="🔍 Search products…" oninput="filterProducts()" />

  <select id="category-filter" onchange="filterProducts()">
    <option value="all">All Categories</option>
    <option value="electronics">Electronics</option>
    <option value="jewelery">Jewellery</option>
    <option value="men's clothing">Men's Clothing</option>
    <option value="women's clothing">Women's Clothing</option>
  </select>

  <select id="sort-filter" onchange="filterProducts()">
    <option value="default">Sort: Default</option>
    <option value="price-asc">Price: Low → High</option>
    <option value="price-desc">Price: High → Low</option>
    <option value="rating">Top Rated</option>
    <option value="name">Name A–Z</option>
  </select>

  <button class="btn btn-reset" onclick="resetFilters()">Reset</button>
</div>

<!-- ===== STATUS ===== -->
<div id="status-bar"></div>

<!-- ===== PRODUCT GRID ===== -->
<div id="product-grid"></div>

<!-- ===== PRODUCT MODAL ===== -->
<div id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div id="modal-box">
    <button id="modal-close" onclick="closeModal()">✕</button>
    <img id="modal-img" src="" alt="" />
    <div id="modal-category" class="modal-category"></div>
    <h2 id="modal-title"></h2>
    <div id="modal-price" class="modal-price"></div>
    <div id="modal-rating"></div>
    <p id="modal-desc" class="modal-desc"></p>
    <button class="btn-add-cart" onclick="addToCart()">🛒 Add to Cart</button>
  </div>
</div>

<!-- ===== CART SIDEBAR ===== -->
<div id="cart-sidebar">
  <button id="cart-close" onclick="toggleCart()">✕</button>
  <h3>🛒 Your Cart</h3>
  <div id="cart-items"></div>
  <div id="cart-total">Total: $0.00</div>
  <button class="btn btn-primary" style="margin-top:14px;width:100%;" onclick="alert('Checkout coming soon!')">Checkout</button>
</div>

<script>
  // =============================================
  // STATE
  // =============================================
  let allProducts = [];   // raw data from API
  let currentProduct = null;  // product shown in modal
  let cart = [];

  // =============================================
  // 1. FETCH ALL PRODUCTS on page load
  // =============================================
  async function fetchProducts() {
    showStatus('<span class="loader"></span> Loading products from FakeStore API…');
    showSkeletons(12);

    try {
      // GET https://fakestoreapi.com/products
      const response = await fetch('https://fakestoreapi.com/products');

      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

      allProducts = await response.json(); // array of product objects
      showStatus(`✅ ${allProducts.length} products loaded successfully.`);
      renderProducts(allProducts);

    } catch (err) {
      // Handle network error or API failure
      showStatus(`❌ Failed to fetch products: ${err.message}`);
      document.getElementById('product-grid').innerHTML =
        '<p class="no-results">⚠️ Could not load products. Check your internet connection.</p>';
    }
  }

  // =============================================
  // 2. RENDER PRODUCTS (filtered/sorted array)
  // =============================================
  function renderProducts(products) {
    const grid = document.getElementById('product-grid');

    if (products.length === 0) {
      grid.innerHTML = '<p class="no-results">🔍 No products found matching your criteria.</p>';
      return;
    }

    // Build card HTML for each product
    grid.innerHTML = products.map(p => `
      <div class="product-card" onclick="openModal(${p.id})">
        <img src="${p.image}" alt="${p.title}" loading="lazy" />
        <div class="prod-name">${p.title}</div>
        <div class="prod-price">$${p.price.toFixed(2)}</div>
        <div class="prod-category">${p.category}</div>
        <div class="prod-rating">⭐ ${p.rating.rate} (${p.rating.count} reviews)</div>
      </div>
    `).join('');
  }

  // =============================================
  // 3. FILTER + SORT (client-side)
  // =============================================
  function filterProducts() {
    const query    = document.getElementById('search-box').value.toLowerCase().trim();
    const category = document.getElementById('category-filter').value;
    const sort     = document.getElementById('sort-filter').value;

    // Step 1 — Filter by search query and category
    let result = allProducts.filter(p => {
      const matchSearch   = p.title.toLowerCase().includes(query) ||
                            p.description.toLowerCase().includes(query);
      const matchCategory = category === 'all' || p.category === category;
      return matchSearch && matchCategory;
    });

    // Step 2 — Sort
    if (sort === 'price-asc')  result.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') result.sort((a, b) => b.price - a.price);
    if (sort === 'rating')     result.sort((a, b) => b.rating.rate - a.rating.rate);
    if (sort === 'name')       result.sort((a, b) => a.title.localeCompare(b.title));

    showStatus(`Showing ${result.length} of ${allProducts.length} products.`);
    renderProducts(result);
  }

  function resetFilters() {
    document.getElementById('search-box').value = '';
    document.getElementById('category-filter').value = 'all';
    document.getElementById('sort-filter').value = 'default';
    showStatus(`✅ ${allProducts.length} products loaded successfully.`);
    renderProducts(allProducts);
  }

  // =============================================
  // 4. MODAL – open by product id
  // =============================================
  function openModal(id) {
    // Find product from cached array
    const p = allProducts.find(prod => prod.id === id);
    if (!p) return;

    currentProduct = p;  // store for add-to-cart

    document.getElementById('modal-img').src       = p.image;
    document.getElementById('modal-img').alt       = p.title;
    document.getElementById('modal-title').textContent    = p.title;
    document.getElementById('modal-price').textContent    = `$${p.price.toFixed(2)}`;
    document.getElementById('modal-category').textContent = `📂 ${p.category}`;
    document.getElementById('modal-rating').innerHTML     = `⭐ ${p.rating.rate} / 5 &nbsp; (${p.rating.count} reviews)`;
    document.getElementById('modal-desc').textContent     = p.description;

    document.getElementById('modal-overlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
    currentProduct = null;
  }

  // Close modal if user clicks the dark overlay (outside the box)
  function closeModalOnOverlay(event) {
    if (event.target === document.getElementById('modal-overlay')) closeModal();
  }

  // =============================================
  // 5. CART – add / remove / render
  // =============================================
  function addToCart() {
    if (!currentProduct) return;

    // Check if already in cart
    const existing = cart.find(c => c.id === currentProduct.id);
    if (existing) {
      existing.qty++;
    } else {
      cart.push({ ...currentProduct, qty: 1 });
    }

    updateCartUI();
    closeModal();
    alert(`✅ "${currentProduct.title.substring(0, 40)}…" added to cart!`);
  }

  function removeFromCart(id) {
    cart = cart.filter(c => c.id !== id);
    updateCartUI();
  }

  function updateCartUI() {
    // Badge
    const totalQty = cart.reduce((sum, c) => sum + c.qty, 0);
    document.getElementById('cart-count').textContent = `${totalQty} item${totalQty !== 1 ? 's' : ''}`;

    // Items list
    const itemsEl = document.getElementById('cart-items');
    if (cart.length === 0) {
      itemsEl.innerHTML = '<p style="color:#a0aec0;font-size:0.85rem;padding:20px 0;">Your cart is empty.</p>';
    } else {
      itemsEl.innerHTML = cart.map(c => `
        <div class="cart-item">
          <img src="${c.image}" alt="${c.title}" />
          <span class="ci-name">${c.title.substring(0, 30)}… × ${c.qty}</span>
          <span class="ci-price">$${(c.price * c.qty).toFixed(2)}</span>
          <button class="ci-remove" onclick="removeFromCart(${c.id})">🗑️</button>
        </div>
      `).join('');
    }

    // Total
    const total = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
    document.getElementById('cart-total').textContent = `Total: $${total.toFixed(2)}`;
  }

  function toggleCart() {
    document.getElementById('cart-sidebar').classList.toggle('open');
  }

  // =============================================
  // 6. HELPERS
  // =============================================
  function showStatus(msg) {
    document.getElementById('status-bar').innerHTML = msg;
  }

  // Show skeleton placeholders while loading
  function showSkeletons(n) {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = Array(n).fill('<div class="skeleton"></div>').join('');
  }

  // =============================================
  // BOOT
  // =============================================
  fetchProducts();
</script>
</body>
</html>

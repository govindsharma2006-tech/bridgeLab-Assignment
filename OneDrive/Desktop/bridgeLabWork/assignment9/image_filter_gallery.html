<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive Image Filter Gallery using CSS Grid and CSS Filters" />
  <title>Image Filter Gallery</title>
  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="image_filter_gallery.css" />
</head>
<body>

  <!-- Page Header -->
  <header class="site-header">
    <h1>Responsive Image Filter Gallery</h1>
    <p class="subtitle">Hover over each image to reveal the original</p>
  </header>

  <!-- Main Gallery Section -->
  <main>
    <section class="gallery" aria-label="Image filter gallery">

      <!-- Image 1: Blur -->
      <figure class="gallery-item blur">
        <img src="https://picsum.photos/seed/forest/400/300" alt="Forest landscape" />
        <figcaption>Blur Filter</figcaption>
      </figure>

      <!-- Image 2: Grayscale -->
      <figure class="gallery-item grayscale">
        <img src="https://picsum.photos/seed/city/400/300" alt="City skyline" />
        <figcaption>Grayscale Filter</figcaption>
      </figure>

      <!-- Image 3: Sepia -->
      <figure class="gallery-item sepia">
        <img src="https://picsum.photos/seed/mountain/400/300" alt="Mountain view" />
        <figcaption>Sepia Filter</figcaption>
      </figure>

      <!-- Image 4: Brightness -->
      <figure class="gallery-item brightness">
        <img src="https://picsum.photos/seed/ocean/400/300" alt="Ocean waves" />
        <figcaption>Brightness Filter</figcaption>
      </figure>

      <!-- Image 5: Contrast -->
      <figure class="gallery-item contrast">
        <img src="https://picsum.photos/seed/flowers/400/300" alt="Colorful flowers" />
        <figcaption>Contrast Filter</figcaption>
      </figure>

      <!-- Image 6: Hue-Rotate -->
      <figure class="gallery-item hue-rotate">
        <img src="https://picsum.photos/seed/sunset/400/300" alt="Beautiful sunset" />
        <figcaption>Hue-Rotate Filter</figcaption>
      </figure>

    </section>
  </main>

  <!-- Page Footer -->
  <footer class="site-footer">
    <p>Assignment 9 &mdash; Q1: Responsive Image Filter Gallery</p>
  </footer>

</body>
</html>
